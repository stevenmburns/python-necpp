name: wheels

# Build redistributable PyNEC wheels for manylinux, linking OpenBLAS from the
# scipy-openblas32 PyPI wheel (auditwheel vendors libscipy_openblas into each
# wheel, so they are self-contained — no system BLAS needed at install time).
#
# The host generates the build prerequisites first (build_prereqs.sh in vendor
# mode: copy necpp_src into PyNEC/, run autoconf for config.h, run SWIG), so the
# PyNEC/ tree is self-contained — cibuildwheel only mounts the package dir, so
# the sibling ../necpp_src would otherwise be invisible in the build container.
#
# Windows wheels are a separate follow-up (the autoconf/SWIG/BLAS story differs).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "PyNEC/setup.py"
      - "PyNEC/pyproject.toml"
      - "PyNEC/build_prereqs.sh"
      - ".github/workflows/wheels.yml"
  push:
    tags: ["v*"]

jobs:
  build_wheels:
    name: wheels manylinux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # necpp_src (NEC2++ C++) is a nested submodule
      - name: Install the autoconf toolchain + SWIG (host codegen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool m4 swig
      - name: Generate build prerequisites (vendor necpp_src, config.h, SWIG wrapper)
        env:
          PYNEC_VENDOR_NECPP: "1"
        run: bash PyNEC/build_prereqs.sh
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: PyNEC
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  release:
    name: attach wheels to release
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach wheels to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
