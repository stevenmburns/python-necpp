name: wheels

# Build redistributable PyNEC wheels for manylinux and Windows, linking OpenBLAS
# from the scipy-openblas32 PyPI wheel. auditwheel (Linux) / delvewheel (Windows)
# vendor the OpenBLAS lib into each wheel, so they are self-contained — no system
# BLAS at install time.
#
# The host generates the build prerequisites first (build_prereqs.sh in vendor
# mode: copy necpp_src into PyNEC/, generate config.h, run SWIG), so the PyNEC/
# tree is self-contained — cibuildwheel only mounts the package dir, so the
# sibling ../necpp_src would otherwise be invisible in the build. Linux runs
# autoconf for config.h; Windows uses the committed win32/config.h.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "PyNEC/setup.py"
      - "PyNEC/pyproject.toml"
      - "PyNEC/build_prereqs.sh"
      - "PyNEC/msvc_compat.h"
      - "PyNEC/windows_repair.py"
      - ".github/workflows/wheels.yml"
  push:
    tags: ["v*"]

jobs:
  build_wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # necpp_src (NEC2++ C++) is a nested submodule
      - name: Install the autoconf toolchain + SWIG (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool m4 swig
      - name: Install the autoconf toolchain + SWIG + libomp (macOS)
        if: runner.os == 'macOS'
        # macos-14 is Apple Silicon (arm64). build_prereqs.sh runs autoconf on
        # non-Windows, so the autotools are needed; libomp supplies the OpenMP
        # runtime Apple clang lacks (see PyNEC/setup.py's darwin branch). No
        # Fortran compiler is needed: necpp's configure.ac dropped its vestigial
        # AC_PROG_F77 probe, so the gcc/$F77 workaround is gone.
        run: brew install autoconf automake libtool swig libomp
      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        # Windows uses the committed win32/config.h (no autoconf); only SWIG is
        # needed for codegen. build_prereqs.sh skips autoconf on Windows.
        run: choco install swig -y --no-progress
      - name: Generate build prerequisites (vendor necpp_src, config.h, SWIG wrapper)
        env:
          PYNEC_VENDOR_NECPP: "1"
        # bash runs on both runners (Git Bash on windows-latest).
        run: bash PyNEC/build_prereqs.sh
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        with:
          package-dir: PyNEC
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  release:
    name: attach wheels to release
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach wheels to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

  publish-testpypi:
    # Publish the built wheels to TestPyPI via Trusted Publishing (OIDC) — no
    # stored token. Requires a matching trusted/pending publisher configured on
    # TestPyPI for project `pynec-accel`: owner stevenmburns, repo python-necpp,
    # workflow wheels.yml, no environment. skip-existing makes re-runs
    # idempotent (a version already on TestPyPI is left untouched).
    name: publish to TestPyPI
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
