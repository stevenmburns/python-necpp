[build-system]
requires = ["setuptools", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# 64-bit Linux + Windows. Skip musllinux (scipy-openblas32 targets glibc),
# 32-bit, and PyPy.
skip = "*-musllinux_* *_i686 *-win32 pp*"
test-requires = "pytest"
# No pure-Python fallback for _PyNEC, so a non-loading extension fails the
# import here. test_multiple_sc_cards.py needs the separate `necpp` wrapper.
test-command = "pytest {package}/tests --ignore={package}/tests/test_multiple_sc_cards.py"

[tool.cibuildwheel.linux]
# Build against OpenBLAS from the scipy-openblas32 wheel. --no-build-isolation
# keeps one env across the build and the repair: before-build installs numpy +
# scipy-openblas32 there, setup.py's openblas_pypi backend links libscipy_openblas
# from it, and the repair command resolves the same lib dir so auditwheel
# vendors libscipy_openblas into the wheel (its build rpath points at this env,
# which is gone by repair time, so LD_LIBRARY_PATH must point auditwheel at it).
#
# --exclude libgomp.so.1: do NOT vendor the OpenMP runtime. _PyNEC links libgomp
# for its OpenMP loops; auditwheel would otherwise bundle a private copy with a
# mangled soname (libgomp-<hash>.so.1.0.0). That second libgomp collides with
# the system libgomp used by other accelerated extensions in the same process
# (e.g. momwire._accelerators): both use initial-exec (static) TLS and are
# dlopen'd late, and glibc's static-TLS surplus only fits one — whichever loads
# second hits "cannot allocate memory in static TLS block". momwire then silently
# falls back to its slow pure-Python path. Binding the *system* libgomp.so.1
# (the same one momwire needs) means a single shared instance, so both
# extensions coexist. Trade-off: the wheel now needs a system libgomp at runtime
# — universally present on glibc Linux (it is the GCC OpenMP runtime). OpenBLAS
# and libgfortran stay vendored; only the OpenMP runtime de-vendors.
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
before-build = "pip install numpy scipy-openblas32 setuptools wheel"
environment = { PYNEC_BACKEND = "openblas_pypi" }
repair-wheel-command = "LD_LIBRARY_PATH=$(python -c 'import scipy_openblas32 as o; print(o.get_lib_dir())') auditwheel repair --exclude libgomp.so.1 -w {dest_dir} {wheel}"
# Linux-only: run the suite, then assert the wheel actually shares the system
# libgomp (no bundled copy). Guards against the --exclude above silently
# becoming a no-op and re-introducing the static-TLS collision.
test-command = "pytest {package}/tests --ignore={package}/tests/test_multiple_sc_cards.py && python {package}/tests/verify_shared_libgomp.py"

[tool.cibuildwheel.windows]
# MSVC build against scipy-openblas32. --no-build-isolation keeps one env so
# before-build's numpy + scipy-openblas32 are visible to setup.py's openblas_pypi
# backend. delvewheel vendors scipy_openblas's DLL into the wheel; its DLL ships
# in the package lib dir, which we hand to delvewheel via --add-path.
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
before-build = "pip install numpy scipy-openblas32 delvewheel setuptools wheel"
environment = { PYNEC_BACKEND = "openblas_pypi" }
# cibuildwheel doesn't evaluate $(...) in repair-wheel-command on Windows, so a
# small Python wrapper computes the scipy-openblas DLL dir and runs delvewheel.
repair-wheel-command = "python {package}/windows_repair.py {wheel} {dest_dir}"

[tool.cibuildwheel.macos]
# Apple Silicon only, built natively on the macos-14 (arm64) runner. OpenBLAS
# from scipy-openblas32; OpenMP from Homebrew libomp (Apple clang ships none) —
# LIBOMP_PREFIX feeds setup.py's darwin branch. --no-build-isolation keeps one
# env so before-build's deps are visible to the openblas_pypi backend (mirrors
# Linux). delocate vendors libscipy_openblas + libomp into the wheel; like the
# Linux auditwheel step it needs the dylib dirs on DYLD_LIBRARY_PATH, since the
# build rpaths point at the build env. MACOSX_DEPLOYMENT_TARGET=14.0 is honest
# about the vendored Homebrew libs' minimum OS (can be lowered later with a
# libomp built for an older target).
archs = ["arm64"]
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
before-build = "pip install numpy scipy-openblas32 delocate setuptools wheel"
environment = { PYNEC_BACKEND = "openblas_pypi", LIBOMP_PREFIX = "/opt/homebrew/opt/libomp", MACOSX_DEPLOYMENT_TARGET = "14.0" }
repair-wheel-command = "DYLD_LIBRARY_PATH=$(python -c 'import scipy_openblas32 as o; print(o.get_lib_dir())'):$(brew --prefix libomp)/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
